# vim:fileencoding=utf-8:foldmethod=marker
# Light Owl Orange for Yazi — aligned with Ghostty, tmux, Pi, and Helix.

# Palette reference:
# paper      #fbfbff
# panel      #f6f8ff
# panelSoft  #f0f2fa
# selected   #dbeafe
# ink        #403f53
# muted      #6c6f85
# faint      #b8b4c7
# blue       #4876d6
# cyan       #2aa198
# orange     #f97316
# yellow     #b58900
# green      #4f8f35
# red        #d95468
# violet     #7c6dc7

# : Manager {{{

[mgr]
cwd = { fg = "#2aa198", bold = true }

# Hovered
hovered         = { fg = "#403f53", bg = "#dbeafe", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#f97316", bold = true, italic = true, underline = true }
find_position = { fg = "#7c6dc7", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#4f8f35", bg = "#4f8f35" }
marker_cut      = { fg = "#d95468", bg = "#d95468" }
marker_marked   = { fg = "#2aa198", bg = "#2aa198" }
marker_selected = { fg = "#f97316", bg = "#f97316" }

# Count
count_copied   = { fg = "#fbfbff", bg = "#4f8f35" }
count_cut      = { fg = "#fbfbff", bg = "#d95468" }
count_selected = { fg = "#fbfbff", bg = "#f97316" }

# Border
border_symbol = "│"
border_style  = { fg = "#b8b4c7" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#fbfbff", bg = "#f97316", bold = true }
inactive = { fg = "#4876d6", bg = "#f0f2fa" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#fbfbff", bg = "#f97316", bold = true }
normal_alt  = { fg = "#f97316", bg = "#f0f2fa" }

# Select mode
select_main = { fg = "#fbfbff", bg = "#2aa198", bold = true }
select_alt  = { fg = "#2aa198", bg = "#f0f2fa" }

# Unset mode
unset_main = { fg = "#fbfbff", bg = "#d95468", bold = true }
unset_alt  = { fg = "#d95468", bg = "#f0f2fa" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#b8b4c7" }
perm_type  = { fg = "#4876d6" }
perm_read  = { fg = "#f97316" }
perm_write = { fg = "#d95468" }
perm_exec  = { fg = "#4f8f35" }

# Progress
progress_label  = { fg = "#403f53", bold = true }
progress_normal = { fg = "#f97316", bg = "#f0f2fa" }
progress_error  = { fg = "#fbfbff", bg = "#d95468" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#f97316" }
active   = { fg = "#f97316", bold = true }
inactive = { fg = "#6c6f85" }

# : }}}


# : Input {{{

[input]
border   = { fg = "#f97316" }
title    = { fg = "#4876d6" }
value    = { fg = "#403f53" }
selected = { fg = "#403f53", bg = "#dbeafe", bold = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#f97316" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#f97316" }
title   = { fg = "#4876d6" }
hovered = { fg = "#f97316", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#f0f2fa" }
cand            = { fg = "#2aa198" }
rest            = { fg = "#6c6f85" }
desc            = { fg = "#7c6dc7" }
separator       = "  "
separator_style = { fg = "#b8b4c7" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#2aa198" }
run     = { fg = "#7c6dc7" }
hovered = { fg = "#403f53", bg = "#dbeafe", bold = true }
footer  = { fg = "#f0f2fa", bg = "#403f53" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#f97316" }
title    = { fg = "#4876d6" }
tbl_col  = { fg = "#2aa198" }
tbl_cell = { fg = "#403f53", bg = "#f0f2fa" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#4f8f35" }
title_warn  = { fg = "#f97316" }
title_error = { fg = "#d95468" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "#2aa198" },
	# Media
	{ mime = "{audio,video}/*", fg = "#f97316" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#7c6dc7" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#4f8f35" },
	# Virtual file system
	{ mime = "vfs/*", fg = "#9893a5" },
	# Fallback
	{ url = "*", fg = "#403f53" },
	{ url = "*/", fg = "#4876d6", bold = true },
	{ name = "*", fg = "#403f53" },
	{ name = "*/", fg = "#4876d6", bold = true }
]

# : }}}
