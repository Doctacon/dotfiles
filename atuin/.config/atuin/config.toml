# Atuin shell history - local-first setup.
# Search with Ctrl+R. Up arrow remains normal zsh history navigation.

auto_sync = false
update_check = false
sync_frequency = "0"

search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "prefix"

style = "compact"
inline_height = 18
show_preview = true
enter_accept = false

# Keep sensitive-looking commands out of the searchable database.
secrets_filter = true

[sync]
records = false

[daemon]
enabled = false
autostart = false
